name: Publish Comet Plugin (ACF) Package

on:
  push:
    branches:
      - master
    paths:
      - 'packages/comet-plugin-acf/**'

jobs:
  split:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Split Repository
        run: |
          git subtree split --prefix=packages/comet-plugin-acf -b split-branch

      - name: Clone split branch to temp directory
        run: |
          mkdir -p /tmp/split-repo
          cd /tmp/split-repo
          git init
          git pull $GITHUB_WORKSPACE split-branch
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"

      - name: Create tag in split repo
        if: steps.get_version.outputs.version != 'null' && steps.get_version.outputs.version != ''
        run: |
          cd /tmp/split-repo
          # Check if tag already exists
          if ! git ls-remote --tags https://github.com/doubleedesign/comet-plugin-acf.git | grep -q "refs/tags/v${{ steps.get_version.outputs.version }}"; then
            git tag -a "v${{ steps.get_version.outputs.version }}" -m "Release version ${{ steps.get_version.outputs.version }}"
            echo "tag_created=true" >> $GITHUB_OUTPUT
          else
            echo "Tag v${{ steps.get_version.outputs.version }} already exists in target repository"
            echo "tag_created=false" >> $GITHUB_OUTPUT
          fi
        id: create_tag

      - name: Push to target repository
        uses: ad-m/github-push-action@master
        with:
          github_token: ${{ secrets.COMET_TOKEN }}
          branch: master
          force: true
          directory: /tmp/split-repo
          repository: doubleedesign/comet-plugin-acf
          tags: true
